# Install once per clone:  pre-commit install
# File checks run before each commit; the message hooks enforce the conventions
# in CONTRIBUTING.md, which CI checks again on every pull request.
default_install_hook_types: [pre-commit, prepare-commit-msg, commit-msg]
# Hooks only run on file changes unless they set their own stages.
default_stages: [pre-commit, manual]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      - id: prepare-commit-msg
        name: add issue reference from branch name
        entry: python scripts/commit_conventions.py prepare-msg
        language: python
        stages: [prepare-commit-msg]
        always_run: true
      - id: commit-msg
        name: check commit message conventions
        entry: python scripts/commit_conventions.py check-msg
        language: python
        stages: [commit-msg]
        always_run: true
