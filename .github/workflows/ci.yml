name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR or branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No path filters: both jobs are required status checks on `main` (see scripts/configure_repo.sh),
# and a required check skipped by a path filter would block the pull request forever.
jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # Same image as docker-compose.yml.
        image: postgres:18-alpine
        env:
          POSTGRES_USER: richlife
          POSTGRES_PASSWORD: richlife
          POSTGRES_DB: richlife
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U richlife -d richlife"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    # The app reads its settings from the environment only.
    env:
      DATABASE_URL: postgresql+psycopg://richlife:richlife@localhost:5432/richlife
      JWT_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Apply migrations
        run: uv run alembic upgrade head
      - name: Test
        run: uv run pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
