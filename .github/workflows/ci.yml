name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR or branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No path filters: the Backend and Frontend jobs are required status checks on `main` (see
# scripts/configure_repo.sh), and a required check skipped by a path filter would block the
# pull request forever.
jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # Same image as docker-compose.yml.
        image: postgres:18-alpine
        env:
          POSTGRES_USER: richlife
          POSTGRES_PASSWORD: richlife
          POSTGRES_DB: richlife
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U richlife -d richlife"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        # Same image as docker-compose.yml.
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    # The app reads its settings from the environment only.
    env:
      DATABASE_URL: postgresql+psycopg://richlife:richlife@localhost:5432/richlife
      JWT_SECRET: ci-secret-that-is-at-least-32-characters-long
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Apply migrations
        run: uv run alembic upgrade head
      - name: Test
        run: uv run pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same image as docker-compose.yml.
        image: postgres:18-alpine
        env:
          POSTGRES_USER: richlife
          POSTGRES_PASSWORD: richlife
          POSTGRES_DB: richlife
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U richlife -d richlife"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        # Same image as docker-compose.yml.
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    # Playwright starts the API and the web app, which read their settings from this
    # environment. The WebAuthn and CORS defaults already match the dev server's origin.
    env:
      DATABASE_URL: postgresql+psycopg://richlife:richlife@localhost:5432/richlife
      JWT_SECRET: ci-secret-that-is-at-least-32-characters-long
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Apply migrations
        working-directory: backend
        run: uv run alembic upgrade head
      - name: Test
        working-directory: frontend
        run: npx playwright test
      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  # Builds both Dockerfiles and checks the stack from docker-compose.prod.yml answers.
  # Deliberately not a required status check: leave it out of scripts/configure_repo.sh.
  production-images:
    name: Production images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke test the production stack
        run: make prod-smoke
