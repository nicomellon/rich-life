# Production stack: Postgres, Redis, the API and the web app behind Caddy on ports 80 and
# 443.
# Settings come from the environment; see .env.production.example and docs/deployment.md.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
name: rich-life-prod

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-richlife}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-richlife}
    # No published port: only the backend, on the compose network, reaches the database.
    volumes:
      # Postgres 18+ images keep data in a version-specific directory under this path.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Holds the magic-link tokens and the rate-limit counters, which only need to outlive
  # a few minutes, so nothing is persisted.
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    # No published port: only the backend, on the compose network, reaches Redis.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-richlife}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-richlife}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      # Passkeys are bound to the domain: changing DOMAIN later invalidates every
      # registered passkey.
      WEBAUTHN_RP_ID: ${DOMAIN:?set DOMAIN}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-Rich Life}
      WEBAUTHN_ORIGIN: ${PUBLIC_ORIGIN:-https://${DOMAIN}}
      CORS_ORIGINS: ${PUBLIC_ORIGIN:-https://${DOMAIN}}
      REDIS_URL: redis://redis:6379/0
      # Sign-in links are sent through Resend; the backend refuses to start without
      # EMAIL_API_KEY and EMAIL_FROM.
      EMAIL_DELIVERY: ${EMAIL_DELIVERY:-resend}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    # The migrations run on start (docker-entrypoint.sh), so wait for the database.
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-${DOMAIN}}
    # Caddy needs 80 and 443 to get and serve the certificate; HTTP_PORT and
    # HTTPS_PORT only move them for a local trial.
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      # Caddy's certificates and keys; keeping them avoids Let's Encrypt rate limits.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy

# IPv6 on the compose network, so Caddy sees IPv6 visitors' own addresses. Without it
# Docker forwards their connections over IPv4, they all seem to come from the network's
# gateway, and they share one budget of the backend's per-IP rate limits. Needs Docker
# Engine 27.0 or later, which picks a private IPv6 subnet by itself.
networks:
  default:
    enable_ipv6: true

volumes:
  db-data:
  caddy-data:
  caddy-config:
